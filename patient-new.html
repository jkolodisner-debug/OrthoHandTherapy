<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | New Patient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=57" />
  </head>
  <body>
    <header class="top-nav">
      <a class="nav-link" href="./patient-access.html">Back</a>
    </header>
    <main class="screen screen-centered">
      <section class="card simple-card">
        <p class="eyebrow">New patient</p>
        <h1>Activate your account</h1>
        <p class="support-copy">Enter the patient ID provided by your clinician and your email. We will send you a link to create your password.</p>
        <form class="auth-form" id="patient-activation-form">
          <label class="builder-field">
            <span>Patient ID</span>
            <input id="activation-patient-id" type="text" placeholder="HND-XXXXX" required autocomplete="username" />
          </label>
          <label class="builder-field">
            <span>Email</span>
            <input id="activation-email" type="email" required autocomplete="email" />
          </label>
          <label class="remember-choice">
            <input id="activation-remember" type="checkbox" />
            <span>Remember me on this device</span>
          </label>
          <button class="primary-button large-button" type="submit">Send password setup email</button>
        </form>
        <p class="completion-message" id="patient-access-message"></p>
      </section>
    </main>

    <script src="data.js?v=58"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=61"></script>
    <script src="patient-new.js?v=5"></script>
  </body>
</html>
