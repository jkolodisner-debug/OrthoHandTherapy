<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | Clinician Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=56" />
  </head>
  <body>
    <header class="top-nav">
      <a class="nav-link" href="./index.html">Back</a>
    </header>
    <main class="screen screen-centered">
      <section class="card simple-card">
        <div class="centered-intro">
          <p class="eyebrow">Clinician sign in</p>
          <h1>Sign in</h1>
          <p class="support-copy">Enter the clinician email and password saved on this device.</p>
        </div>
        <form class="auth-form" id="signin-form">
          <label class="builder-field">
            <span>Email</span>
            <input id="signin-email" type="email" />
          </label>
          <label class="builder-field">
            <span>Password</span>
            <div class="password-field-row">
              <input id="signin-password" type="password" />
              <button class="nav-link inline-button password-toggle-button" id="signin-password-toggle" type="button">Show</button>
            </div>
          </label>
          <button class="primary-button large-button" type="submit">Open clinician portal</button>
        </form>
        <p class="completion-message" id="signin-message"></p>
      </section>
      <p class="account-prompt">No account? <a href="./account.html?mode=create">Create one here</a>.</p>
    </main>

    <script src="data.js?v=30"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=32"></script>
    <script src="clinician-signin.js?v=20"></script>
  </body>
</html>
