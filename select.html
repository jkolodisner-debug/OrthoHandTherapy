<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | Clinician Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=56" />
  </head>
  <body>
    <main class="screen screen-centered">
      <section class="card builder-card clinician-portal-card">
        <p class="eyebrow">Clinician portal</p>
        <h1>Track patient status</h1>
        <p class="support-copy">
          Review patient status and manage existing patient plans.
        </p>

        <div class="portal-grid">
          <article class="portal-card">
            <span class="stat-label">Track status</span>
            <form class="inline-form" id="track-patient-form">
              <label class="builder-field">
                <span>Enter patient ID to track status</span>
                <input id="track-patient-id" type="text" placeholder="HND-XXXXX" />
              </label>
              <button class="primary-button inline-button" type="submit">Open status tracking</button>
            </form>
            <p class="completion-message" id="track-message"></p>
          </article>
        </div>

        <div class="portal-grid compact-grid clinician-actions-grid">
          <a class="nav-link large-button" href="./patients.html">See associated patients</a>
          <a class="nav-link large-button" href="./account.html?mode=details">Account details</a>
          <button class="nav-link large-button" id="clinician-sign-out" type="button">Sign out</button>
        </div>
      </section>
    </main>

    <script src="data.js?v=30"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=32"></script>
    <script src="select.js?v=21"></script>
  </body>
</html>
