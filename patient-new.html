<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | New Patient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=57" />
  </head>
  <body>
    <header class="top-nav">
      <a class="nav-link" href="./patient-access.html">Back</a>
    </header>
    <main class="screen screen-centered">
      <section class="card simple-card">
        <p class="eyebrow">New patient</p>
        <h1>Create your account</h1>
        <p class="support-copy" id="patient-signup-support-copy">Start with your account details, then link the patient ID from your clinician.</p>
        <form class="auth-form" id="patient-signup-form">
          <label class="builder-field">
            <span>First name</span>
            <input id="patient-first-name" type="text" required autocomplete="given-name" />
          </label>
          <label class="builder-field">
            <span>Last name</span>
            <input id="patient-last-name" type="text" required autocomplete="family-name" />
          </label>
          <label class="builder-field">
            <span>Email</span>
            <input id="patient-signup-email" type="email" required autocomplete="email" />
          </label>
          <label class="builder-field">
            <span>Create password</span>
            <input id="patient-signup-password" type="password" minlength="8" required autocomplete="new-password" />
          </label>
          <label class="builder-field">
            <span>Confirm password</span>
            <input id="patient-signup-confirm" type="password" minlength="8" required autocomplete="new-password" />
          </label>
          <button class="primary-button large-button" type="submit">Continue</button>
        </form>

        <form class="auth-form hidden" id="patient-link-form" hidden>
          <label class="builder-field">
            <span>Patient ID</span>
            <input id="activation-patient-id" type="text" placeholder="HND-XXXXX" required autocomplete="username" />
          </label>
          <label class="remember-choice">
            <input id="activation-remember" type="checkbox" />
            <span>Remember me on this device</span>
          </label>
          <button class="primary-button large-button" type="submit">Link patient ID and open my program</button>
          <button class="secondary-button large-button" id="patient-link-back" type="button">Back</button>
        </form>
        <p class="completion-message" id="patient-access-message"></p>
      </section>
    </main>

    <script src="data.js?v=58"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=63"></script>
    <script src="patient-new.js?v=6"></script>
  </body>
</html>
