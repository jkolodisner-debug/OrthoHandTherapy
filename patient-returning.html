<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | Returning Patient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=56" />
  </head>
  <body>
    <header class="top-nav">
      <a class="nav-link" href="./patient-access.html">Back</a>
    </header>
    <main class="screen screen-centered">
      <section class="card simple-card patient-returning-card">
        <div class="centered-intro">
          <p class="eyebrow">Returning patient</p>
          <h1>Welcome back</h1>
          <p class="support-copy">Enter your patient ID and password to open your assigned program.</p>
        </div>
        <form class="auth-form" id="patient-access-form">
          <label class="builder-field">
            <span>Patient ID</span>
            <input id="patient-id-input" type="text" placeholder="HND-XXXXX" required autocomplete="off" />
          </label>
          <label class="builder-field">
            <span>Password</span>
            <input id="patient-password-input" type="password" required autocomplete="current-password" />
          </label>
          <label class="remember-choice">
            <input id="patient-remember" type="checkbox" />
            <span>Remember me on this device</span>
          </label>
          <button class="primary-button large-button" type="submit">Open my exercises</button>
        </form>
        <p class="completion-message" id="patient-access-message"></p>
      </section>
    </main>
    <script src="data.js?v=30"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=32"></script>
    <script src="patient-returning.js?v=3"></script>
  </body>
</html>
