<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=57" />
  </head>
  <body>
    <header class="top-nav">
      <a class="nav-link" id="forgot-password-back-link" href="./clinician-signin.html">Back</a>
    </header>
    <main class="screen screen-centered">
      <section class="card simple-card">
        <div class="centered-intro">
          <p class="eyebrow" id="forgot-password-eyebrow">Clinician access</p>
          <h1 id="forgot-password-title">Forgot your password?</h1>
          <p class="support-copy" id="forgot-password-support-copy">
            Enter the clinician email tied to your account and we will send a secure reset link.
          </p>
        </div>

        <form class="auth-form" id="forgot-password-request-form">
          <label class="builder-field">
            <span>Email</span>
            <input id="forgot-password-email" type="email" />
          </label>
          <button class="primary-button large-button" type="submit">Send reset link</button>
        </form>

        <form class="auth-form hidden" id="forgot-password-reset-form" hidden>
          <label class="builder-field">
            <span>New password</span>
            <div class="password-field-row">
              <input id="forgot-password-new" type="password" />
              <button class="nav-link inline-button password-toggle-button" id="forgot-password-new-toggle" type="button">Show</button>
            </div>
          </label>
          <label class="builder-field">
            <span>Confirm new password</span>
            <div class="password-field-row">
              <input id="forgot-password-confirm" type="password" />
              <button class="nav-link inline-button password-toggle-button" id="forgot-password-confirm-toggle" type="button">Show</button>
            </div>
          </label>
          <button class="primary-button large-button" type="submit">Save new password</button>
        </form>

        <p class="completion-message" id="forgot-password-message"></p>
      </section>
    </main>

    <script src="data.js?v=30"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=62"></script>
    <script src="forgot-password.js?v=2"></script>
  </body>
</html>
