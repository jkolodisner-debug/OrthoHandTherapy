<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Online Hand Recovery | New Patient</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=57" />
  </head>
  <body>
    <header class="top-nav">
      <a class="nav-link" href="./patient-access.html">Back</a>
    </header>
    <main class="screen screen-centered">
      <section class="card simple-card">
        <p class="eyebrow">New patient</p>
        <h1>Create your account</h1>
        <p class="support-copy" id="patient-signup-support-copy">Start with your email and password, then choose your physician.</p>
        <form class="auth-form" id="patient-signup-form">
          <label class="builder-field">
            <span>Email</span>
            <input id="patient-signup-email" type="email" required autocomplete="email" />
          </label>
          <label class="builder-field">
            <span>Create password</span>
            <input id="patient-signup-password" type="password" minlength="8" required autocomplete="new-password" />
          </label>
          <label class="builder-field">
            <span>Confirm password</span>
            <input id="patient-signup-confirm" type="password" minlength="8" required autocomplete="new-password" />
          </label>
          <button class="primary-button large-button" type="submit">Continue</button>
        </form>
        <p class="completion-message" id="patient-access-message"></p>
      </section>
    </main>

    <div class="patient-choice-overlay hidden" id="patient-clinician-overlay" role="dialog" aria-modal="true" aria-labelledby="patient-clinician-title">
      <section class="patient-choice-popup">
        <span class="sheet-pill sheet-pill-patient">Choose physician</span>
        <h2 id="patient-clinician-title">Select your physician</h2>
        <p>We will create your account, assign your patient ID, and connect your program automatically.</p>
        <form class="auth-form" id="patient-clinician-form">
          <label class="builder-field">
            <span>Physician</span>
            <select id="patient-clinician-select" required>
              <option value="">Choose your physician</option>
            </select>
          </label>
          <label class="remember-choice">
            <input id="activation-remember" type="checkbox" />
            <span>Remember me on this device</span>
          </label>
          <button class="primary-button large-button" type="submit">Create account</button>
          <button class="secondary-button large-button" id="patient-clinician-back" type="button">Back</button>
        </form>
        <p class="completion-message" id="patient-clinician-message"></p>
      </section>
    </div>

    <script src="data.js?v=58"></script>
    <script src="app-config.js?v=2"></script>
    <script src="api-client.js?v=64"></script>
    <script src="patient-new.js?v=8"></script>
  </body>
</html>
